# 1. ATUR MEDIA GLOBAL TERLEBIH DAHULU
media:
  path: public/images/uploads

# 2. ATUR KOLEKSI KONTEN
content:
  - name: world
    label: "World Intelligence"
    type: collection
    path: src/content/blog/world
    format: frontmatter
    # Hilangkan baris media internal jika masih error, 
    # atau pastikan jalurnya ada di bawah ini:
    media:
      path: public/images/world
    fields:
      - name: title
        label: Judul Artikel
        type: string
        required: true
      - name: pubDate
        label: Tanggal Terbit
        type: date
      - name: description
        label: Deskripsi (SEO)
        type: string
      - name: image
        label: Gambar Utama
        type: image
      - name: body
        label: Isi Konten
        type: rich-text

  - name: market
    label: "Market Analysis"
    type: collection
    path: src/content/blog/market
    format: frontmatter
    media:
      path: public/images/market
    fields:
      - name: title
        label: Judul Artikel
        type: string
        required: true
      - name: pubDate
        label: Tanggal Terbit
        type: date
      - name: description
        label: Deskripsi (SEO)
        type: string
      - name: image
        label: Gambar Utama
        type: image
      - name: body
        label: Isi Konten
        type: rich-text

  - name: company
    label: "Company News"
    type: collection
    path: src/content/blog/company
    format: frontmatter
    media:
      path: public/images/company
    fields:
      - name: title
        label: Judul Artikel
        type: string
        required: true
      - name: pubDate
        label: Tanggal Terbit
        type: date
      - name: description
        label: Deskripsi (SEO)
        type: string
      - name: image
        label: Gambar Utama
        type: image
      - name: body
        label: Isi Konten
        type: rich-text